plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// The scripted self-test is for development only.
jar {
	exclude 'com/greysworkshop/portalquarry/SelfTest*'
	exclude 'com/greysworkshop/portalquarry/PracticalTest*'
}

loom {
	runs {
		selfTest {
			client()
			name = "Self Test"
			vmArgs "-Dportalquarry.selftest=true", "-Dportalquarry.debug=true", "-Xmx1536m"
			runDir "run"
		}
		practicalTest {
			client()
			name = "Practical Test"
			vmArgs "-Dportalquarry.practical=true", "-Dportalquarry.debug=true", "-Xmx2g", "-Dportalquarry.minutes=${findProperty('pqMinutes') ?: 20}"
			runDir "run"
		}
	}
}
